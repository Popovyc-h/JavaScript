<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="style.css" defer />
        <script src="index.js" defer></script>
    </head>
    <body>
        <header>
            <h1 id="title">Мій щоденник</h1>
            <button id="theme-toggle">Змінити тему</button>
        </header>

        <div id="entries"></div>

        <form id="entry-form">
            <input type="text" id="entry-title" placeholder="Назва запису" />
            <textarea id="entry-text" placeholder="Текст запису"></textarea>
            <button id="btn" type="submit">Додати запис</button>
        </form>
    </body>
</html>
